name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cd compiler && cargo build --release

      - name: Run tests
        run: cd compiler && cargo test --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cd compiler && cargo fmt --all -- --check

      - name: Run clippy
        run: cd compiler && cargo clippy --workspace -- -D warnings

  transpile-examples:
    name: Transpile Examples
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI
        run: cd compiler && cargo build --release

      - name: Transpile all examples
        run: |
          for f in examples/*.poly; do
            echo "Transpiling $f..."
            ./compiler/target/release/poly "$f" > /dev/null
          done

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, lint, transpile-examples]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cd compiler && cargo build --release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            compiler/target/release/poly
          generate_release_notes: true
