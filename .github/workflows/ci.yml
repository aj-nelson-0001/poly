name: CI

on:
  push:
    branches: [ master, main, v1.7.3-audit-fixes ]
  pull_request:
    branches: [ master, main, v1.7.3-audit-fixes ]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install C compiler on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add MinGW compiler to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"

      - name: Configure C compiler
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "POLY_CC=gcc" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "POLY_CC=clang" >> "$GITHUB_ENV"
          else
            echo "POLY_CC=cc" >> "$GITHUB_ENV"
          fi

      - name: Verify C compiler
        shell: bash
        run: '"$POLY_CC" --version'

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --manifest-path compiler/Cargo.toml --release

      - name: Check all targets
        run: cargo check --manifest-path compiler/Cargo.toml --workspace --all-targets

      - name: Run tests
        run: cargo test --manifest-path compiler/Cargo.toml --workspace -- --test-threads=1

      - name: Check Rust examples
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            POLY_BIN="./compiler/target/release/poly.exe"
          else
            POLY_BIN="./compiler/target/release/poly"
          fi
          for f in examples/*.poly; do
            echo "Checking $f..."
            "$POLY_BIN" --target rust --check "$f"
          done

      - name: Check and run C target fixture
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            POLY_BIN="./compiler/target/release/poly.exe"
            C_BINARY="./tests/c_target_tests.exe"
          else
            POLY_BIN="./compiler/target/release/poly"
            C_BINARY="./tests/c_target_tests"
          fi
          "$POLY_BIN" --target c --check tests/c_target_tests.poly
          "$POLY_BIN" --target c tests/c_target_tests.poly
          actual_output=$("$C_BINARY" | tr -d '\r')
          expected_output=$'30\n3'
          if [ "$actual_output" != "$expected_output" ]; then
            printf 'Unexpected C fixture output:\n%s\n' "$actual_output"
            exit 1
          fi
          rm -f tests/c_target_tests.c tests/c_target_tests tests/c_target_tests.exe

      - name: Check and run asm target fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          POLY_BIN="./compiler/target/release/poly"
          "$POLY_BIN" --target asm --check tests/extern_asm_deref.poly
          "$POLY_BIN" --target asm tests/extern_asm_deref.poly -o tests/extern_asm_deref.S
          cc tests/extern_asm_deref.S -o tests/extern_asm_deref_bin -nostartfiles
          actual_output=$(./tests/extern_asm_deref_bin)
          expected_asm_output=$'42\n10\n30\n60'
          if [ "$actual_output" != "$expected_asm_output" ]; then
            printf 'Unexpected asm fixture output:\n%s\n' "$actual_output"
            exit 1
          fi
          rm -f tests/extern_asm_deref.S tests/extern_asm_deref_bin
          rm -f tests/c_target_tests.c tests/c_target_tests tests/c_target_tests.exe

      - name: Verify mixed target selection
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            POLY_BIN="./compiler/target/release/poly.exe"
          else
            POLY_BIN="./compiler/target/release/poly"
          fi
          "$POLY_BIN" --target rust --check tests/target_flag_tests.poly
          "$POLY_BIN" --target c --check tests/c_target_tests.poly

  lint:
    name: Lint and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: lint-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: lint-cargo-

      - name: Check formatting
        run: cargo fmt --manifest-path compiler/Cargo.toml --all -- --check

      - name: Run clippy
        run: cargo clippy --manifest-path compiler/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Check Markdown conventions
        run: python3 scripts/check_markdown.py

      - name: Check maintained v2 Poly documentation
        run: >-
          python3 scripts/check_poly_examples.py
          README.md POLY_SPEC_v2.md POLY_ROADMAP_v2.md POLY_C_BLOCKS.md
          POLY_V2_AUDIT.md POLY_MIGRATION_GUIDE_v2.md
          POLY_V2_SUPPORT_MATRIX.md POLY_PREVIEW_RELEASE_CHECKLIST.md
          POLY_V2_PREVIEW_RELEASE_NOTES.md

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cd compiler && cargo audit

  wasm:
    name: WebAssembly Artifact
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown

      - name: Rebuild playground wasm
        working-directory: compiler
        run: bash scripts/build_playground_wasm.sh

      - name: Verify rebuilt wasm
        working-directory: compiler
        run: |
          wasm_file="../playground/poly.wasm"
          if [ ! -s "$wasm_file" ]; then
            echo "WASM artifact is missing or empty: $wasm_file"
            exit 1
          fi
          sha256sum "$wasm_file"
          wc -c < "$wasm_file"

      - name: Run playground wasm smoke test
        run: node scripts/playground_wasm_smoke.mjs

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, lint, audit, wasm]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Build release binary
        run: cargo build --manifest-path compiler/Cargo.toml --release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            compiler/target/release/poly
          generate_release_notes: true
