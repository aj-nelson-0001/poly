name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always
  # Keep Cargo/rustc from creating a process burst on small CI runners.
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cd compiler && cargo build --release

      # Compile every target (benches, examples, tests) so retired-syntax
      # fixtures and other all-targets regressions fail loudly instead of
      # being skipped by `cargo test`.
      - name: Check all targets
        run: cd compiler && cargo check --workspace --all-targets

      - name: Run tests
        run: cd compiler && cargo test --workspace -- --test-threads=1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cd compiler && cargo fmt --all -- --check

      - name: Run clippy
        run: cd compiler && cargo clippy --workspace -- -D warnings

      - name: Check Markdown conventions
        run: python3 scripts/check_markdown.py

      - name: Check Poly documentation examples
        run: python3 scripts/check_poly_examples.py

  transpile-examples:
    name: Transpile Examples
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI
        run: cd compiler && cargo build --release

      - name: Check all examples
        run: |
          for f in examples/*.poly; do
            echo "Checking $f..."
            ./compiler/target/release/poly --check "$f"
          done

  wasm:
    name: WebAssembly Artifact
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rebuild playground wasm
        run: bash compiler/scripts/build_playground_wasm.sh

      - name: Verify checked-in wasm is current
        run: git diff --exit-code -- playground/poly.wasm

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, lint, transpile-examples, wasm]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cd compiler && cargo build --release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            compiler/target/release/poly
          generate_release_notes: true
