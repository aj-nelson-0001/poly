name: CI

on:
  push:
    branches: [ master, main, v1.7.3-audit-fixes, v2.0-dev ]
  pull_request:
    branches: [ master, main, v1.7.3-audit-fixes, v2.0-dev ]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install C compiler on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add MinGW compiler to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"

      - name: Configure C compiler
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "POLY_CC=gcc" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "POLY_CC=clang" >> "$GITHUB_ENV"
          else
            echo "POLY_CC=cc" >> "$GITHUB_ENV"
          fi

      - name: Verify C compiler
        shell: bash
        run: '"$POLY_CC" --version'

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --manifest-path compiler/Cargo.toml --release

      - name: Check all targets
        run: cargo check --manifest-path compiler/Cargo.toml --workspace --all-targets

      - name: Run tests
        run: cargo test --manifest-path compiler/Cargo.toml --workspace -- --test-threads=1

      - name: Check Rust examples
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            POLY_BIN="./compiler/target/release/poly.exe"
          else
            POLY_BIN="./compiler/target/release/poly"
          fi
          for f in examples/*.poly; do
            echo "Checking $f..."
            "$POLY_BIN" --target rust --check --strict "$f"
          done

      - name: Check and run C target fixture
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            POLY_BIN="./compiler/target/release/poly.exe"
            C_BINARY="./tests/c_target_tests.exe"
          else
            POLY_BIN="./compiler/target/release/poly"
            C_BINARY="./tests/c_target_tests"
          fi
          "$POLY_BIN" --target c --check --strict tests/c_target_tests.poly
          "$POLY_BIN" --target c tests/c_target_tests.poly
          actual_output=$("$C_BINARY" | tr -d '\r')
          expected_output=$'30\n3'
          if [ "$actual_output" != "$expected_output" ]; then
            printf 'Unexpected C fixture output:\n%s\n' "$actual_output"
            exit 1
          fi
          rm -f tests/c_target_tests.c tests/c_target_tests tests/c_target_tests.exe

      - name: Check and run asm target fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          POLY_BIN="./compiler/target/release/poly"
          "$POLY_BIN" --target asm --check --strict tests/extern_asm_deref.poly
          "$POLY_BIN" --target asm tests/extern_asm_deref.poly -o tests/extern_asm_deref.S
          cc tests/extern_asm_deref.S -o tests/extern_asm_deref_bin -nostartfiles
          actual_output=$(./tests/extern_asm_deref_bin)
          expected_asm_output=$'42\n10\n30\n60'
          if [ "$actual_output" != "$expected_asm_output" ]; then
            printf 'Unexpected asm fixture output:\n%s\n' "$actual_output"
            exit 1
          fi
          rm -f tests/extern_asm_deref.S tests/extern_asm_deref_bin
          rm -f tests/c_target_tests.c tests/c_target_tests tests/c_target_tests.exe

      - name: Verify mixed target selection
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            POLY_BIN="./compiler/target/release/poly.exe"
          else
            POLY_BIN="./compiler/target/release/poly"
          fi
          "$POLY_BIN" --target rust --check --strict tests/target_flag_tests.poly
          "$POLY_BIN" --target c --check --strict tests/c_target_tests.poly

      - name: Check and run JS target fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          POLY_BIN="./compiler/target/release/poly"
          "$POLY_BIN" --target js --check --strict tests/js_target_tests.poly
          "$POLY_BIN" --target js --emit-js tests/js_target_tests.poly > tests/js_target_tests.js
          node --check tests/js_target_tests.js
          actual_output=$(node tests/js_target_tests.js)
          expected_js_output=$'42\nhello world\n15\n1\n0\n1\n2\n10\n20\n5'
          if [ "$actual_output" != "$expected_js_output" ]; then
            printf 'Unexpected JS fixture output:\n%s\n' "$actual_output"
            exit 1
          fi
          rm -f tests/js_target_tests.js

  lint:
    name: Lint and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: lint-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: lint-cargo-

      - name: Check formatting
        run: cargo fmt --manifest-path compiler/Cargo.toml --all -- --check

      - name: Run clippy
        run: cargo clippy --manifest-path compiler/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Build poly for documentation audit
        run: cargo build --manifest-path compiler/Cargo.toml --release -p poly-cli

      - name: Check Markdown conventions
        run: python3 scripts/check_markdown.py

      - name: Audit all Poly documentation examples
        run: >-
          python3 scripts/check_poly_examples.py
          --poly-bin compiler/target/release/poly

      - name: Check generated files for machine-specific paths
        run: python3 scripts/check_generated_paths.py

  tetris:
    name: Tetris example (Linux)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
            tetris/rust_output/tetris/target
          key: tetris-cargo-${{ hashFiles('compiler/**/Cargo.lock', 'tetris/rust_output/tetris/Cargo.lock') }}
          restore-keys: |
            tetris-cargo-

      - name: Build poly compiler
        run: cargo build --manifest-path compiler/Cargo.toml --release -p poly-cli

      - name: Regenerate tetris Rust project
        working-directory: tetris
        run: |
          # --project refuses to touch an existing directory, so stash the
          # tracked generated files first: they are the baseline we guard.
          mkdir -p /tmp/tetris-tracked
          cp rust_output/tetris/Cargo.toml rust_output/tetris/Cargo.lock rust_output/tetris/.poly-generated /tmp/tetris-tracked/
          rm -rf rust_output/tetris
          ../compiler/target/release/poly --project rust_output/tetris tetris.poly
          # The regenerated project must match the committed files byte-for-byte.
          for f in Cargo.toml .poly-generated; do
            diff "/tmp/tetris-tracked/$f" "rust_output/tetris/$f"
          done
          # src/main.rs must reproduce byte-for-byte too (modulo one trailing
          # newline that only --emit-rust adds).
          diff <(../compiler/target/release/poly tetris.poly --emit-rust | sed -e '$d') rust_output/tetris/src/main.rs
          # --project does not emit a lockfile (cargo resolves it on first
          # build), so regenerate it and compare against the committed one.
          cargo generate-lockfile --manifest-path rust_output/tetris/Cargo.toml
          diff /tmp/tetris-tracked/Cargo.lock rust_output/tetris/Cargo.lock

      - name: Build and self-test tetris
        run: |
          cargo build --release --manifest-path tetris/rust_output/tetris/Cargo.toml
          tetris/rust_output/tetris/target/release/tetris --test

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cd compiler && cargo audit

  wasm:
    name: WebAssembly Artifact
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown

      - name: Rebuild playground wasm
        working-directory: compiler
        run: bash scripts/build_playground_wasm.sh

      - name: Verify rebuilt wasm
        working-directory: compiler
        run: |
          wasm_file="../playground/poly.wasm"
          if [ ! -s "$wasm_file" ]; then
            echo "WASM artifact is missing or empty: $wasm_file"
            exit 1
          fi
          sha256sum "$wasm_file"
          wc -c < "$wasm_file"

      - name: Run playground wasm smoke test
        run: node scripts/playground_wasm_smoke.mjs

# Release publishing is owned by .github/workflows/release.yml (build job +
# create-release job, triggered on v* tags). CI no longer duplicates it: two
# jobs uploading assets to the same release raced and made results order-
# dependent. The CI workflow still runs on tag pushes via its branch and PR
# gates so the tag commit's test/lint/audit/tetris/wasm results are visible
# next to the release.
