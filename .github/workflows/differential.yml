name: Differential Backends (nightly)

on:
  schedule:
    # 03:07 UTC daily — off the hour to avoid the runner rush.
    - cron: "7 3 * * *"
  workflow_dispatch: {}

# Least privilege: these jobs compile and execute every `.poly` file in the
# tree, so no token scope is warranted.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  differential:
    name: Differential backend suite (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4dfd137a5aecc12897f37a01818006f58cf58347 # 1.98.0

      - name: Build compiler
        run: cargo build --release -p poly-cli
        working-directory: compiler

      - name: Run differential backend suite
        run: python3 scripts/check_backends.py --poly-bin compiler/target/release/poly

      - name: Run stress differential suite
        # Heavier programs (long chains, thousands of arena allocations,
        # big loops): slow on the unoptimized asm target, so nightly only.
        run: python3 scripts/check_backends.py --poly-bin compiler/target/release/poly --stress

  fuzz:
    name: Differential fuzz sweep (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4dfd137a5aecc12897f37a01818006f58cf58347 # 1.98.0

      - name: Build compiler
        run: cargo build --release -p poly-cli
        working-directory: compiler

      - name: Run differential fuzzer
        # A day-derived start seed rotates coverage nightly while keeping a
        # given day's run reproducible.
        run: |
          python3 scripts/fuzz_backends.py \
            --poly-bin compiler/target/release/poly \
            --seeds 60 --start "$(( ($(date +%s) / 86400) * 1000 ))" \
            | tee fuzz_output.txt

      - name: Upload divergence artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-divergences
          path: |
            /tmp/fuzz_divergence_*.poly
            fuzz_output.txt
          if-no-files-found: ignore
