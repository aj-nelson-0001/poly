name: Release

on:
  push:
    tags:
      # The tag history uses both spellings: v-prefixed (v2.0.0-preview.10,
      # v2.0.0-preview.11) and unprefixed (2.0.0-preview.12 and later). The
      # version guard below strips the "v" only when present, so both forms
      # release the version they name.
      - 'v*'
      - '2.*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: poly-linux-amd64
          - os: macos-latest
            asset: poly-macos-arm64
          - os: windows-latest
            asset: poly-windows-amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Build release binary
        run: cd compiler && cargo build --release

      - name: Rename binary for its platform
        shell: bash
        # Rename before upload: Linux and macOS both produce a file named
        # `poly`, and the download step merges artifacts into one directory,
        # so same-named files would clobber each other.
        run: |
          if [ -f compiler/target/release/poly.exe ]; then
            mv compiler/target/release/poly.exe "compiler/target/release/${{ matrix.asset }}.exe"
          else
            mv compiler/target/release/poly "compiler/target/release/${{ matrix.asset }}"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: compiler/target/release/${{ matrix.asset }}*

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: ./bin
          merge-multiple: true

      - name: Verify binary version matches the tag
        run: |
          # The tag must name the version it releases; a mismatch means the
          # tag was cut from a tree whose version was never bumped. The
          # Linux binary is the reference; every build compiles the same
          # CARGO_PKG_VERSION. download-artifact does not preserve the
          # executable bit.
          chmod +x ./bin/poly-linux-amd64
          tag="${GITHUB_REF_NAME#v}"
          reported="$(./bin/poly-linux-amd64 --version)"
          if [ "$reported" != "poly ${tag}" ]; then
            echo "version mismatch: binary reports '$reported', tag says '${tag}'"
            exit 1
          fi
          echo "binary version matches tag ${GITHUB_REF_NAME}"

      - name: Verify CHANGELOG documents the tagged version
        run: |
          # A tag whose version is missing from CHANGELOG.md means the
          # release notes were not cut; the release body would then come
          # from a stale POLY_V2_PREVIEW_RELEASE_NOTES.md too.
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[${tag}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [${tag}]' section — cut the release notes before tagging"
            exit 1
          fi
          echo "CHANGELOG.md documents ${tag}"

      - name: Generate checksums and version the binary assets
        run: |
          # Ship a sha256sums.txt covering every uploaded asset. Binaries
          # gain the release version in their name so assets from different
          # releases are distinguishable in a downloads directory.
          version="${GITHUB_REF_NAME#v}"
          cd ./bin
          mv poly-linux-amd64 "poly-linux-amd64-${version}"
          mv poly-macos-arm64 "poly-macos-arm64-${version}"
          mv poly-windows-amd64.exe "poly-windows-amd64-${version}.exe"
          ls -la
          sha256sum poly-* > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Use the committed release-notes document as the body:
          # POLY_V2_PREVIEW_RELEASE_NOTES.md is maintained by hand each
          # release and carries the Target Contract, Compatibility Notes,
          # and Verification Evidence sections.
          body_path: POLY_V2_PREVIEW_RELEASE_NOTES.md
          # Preview tags publish as prereleases; stable tags (no "preview"
          # segment in the tag name) publish as full releases.
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          files: |
            ./bin/poly-*
            ./bin/sha256sums.txt
