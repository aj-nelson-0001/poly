name: Release

on:
  push:
    tags:
      # The tag history uses both spellings: v-prefixed (v2.0.0-preview.10,
      # v2.0.0-preview.11) and unprefixed (2.0.0-preview.12 and later). The
      # version guard below strips the "v" only when present, so both forms
      # release the version they name.
      - 'v*'
      - '2.*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Build release binary
        run: cd compiler && cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: poly-linux-amd64
          path: compiler/target/release/poly

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: poly-linux-amd64
          path: ./bin

      - name: Verify binary version matches the tag
        run: |
          # The tag must name the version it releases; a mismatch means the
          # tag was cut from a tree whose version was never bumped.
          # download-artifact does not preserve the executable bit.
          chmod +x ./bin/poly
          tag="${GITHUB_REF_NAME#v}"
          reported="$(./bin/poly --version)"
          if [ "$reported" != "poly ${tag}" ]; then
            echo "version mismatch: binary reports '$reported', tag says '${tag}'"
            exit 1
          fi
          echo "binary version matches tag ${GITHUB_REF_NAME}"

      - name: Generate checksums and rename binary asset
        run: |
          # Ship a sha256sums.txt covering every uploaded asset. The binary
          # is renamed to carry the version so assets from different
          # releases are distinguishable in a downloads directory.
          version="${GITHUB_REF_NAME#v}"
          mv ./bin/poly "./bin/poly-linux-amd64-${version}"
          cd ./bin
          sha256sum poly-linux-amd64-* > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Use the committed release-notes document as the body:
          # POLY_V2_PREVIEW_RELEASE_NOTES.md is maintained by hand each
          # release and carries the Target Contract, Compatibility Notes,
          # and Verification Evidence sections.
          body_path: POLY_V2_PREVIEW_RELEASE_NOTES.md
          # Preview tags publish as prereleases; stable tags (no "preview"
          # segment in the tag name) publish as full releases.
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          files: |
            ./bin/poly-linux-amd64-*
            ./bin/sha256sums.txt
