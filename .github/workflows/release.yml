name: Release

on:
  push:
    tags:
      # The tag history uses both spellings: v-prefixed (v2.0.0-preview.10,
      # v2.0.0-preview.11) and unprefixed (2.0.0-preview.12 and later). The
      # version guard below strips the "v" only when present, so both forms
      # release the version they name.
      - 'v*'
      - '2.*'

# Least privilege: only the `create-release` job needs a token, and only
# `contents: write` to publish the release. The build jobs compile `.poly`
# sources and run cargo, so they get no scopes at all. Artifact upload/download
# uses the Actions runtime token, not GITHUB_TOKEN, so it is unaffected.
permissions: {}

# The published module's size budget and the pinned wasm-opt live in
# .github/workflows/wasm-build.yml, which both this workflow and ci.yml call:
# the artifact users download is the definition CI gates, not a second copy.

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: poly-linux-amd64
          - os: macos-latest
            asset: poly-macos-arm64
          - os: windows-latest
            asset: poly-windows-amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4dfd137a5aecc12897f37a01818006f58cf58347 # 1.98.0

      - name: Build release binary
        run: cd compiler && cargo build --release

      - name: Rename binary for its platform
        shell: bash
        # Rename before upload: Linux and macOS both produce a file named
        # `poly`, and the download step merges artifacts into one directory,
        # so same-named files would clobber each other.
        run: |
          if [ -f compiler/target/release/poly.exe ]; then
            mv compiler/target/release/poly.exe "compiler/target/release/${{ matrix.asset }}.exe"
          else
            mv compiler/target/release/poly "compiler/target/release/${{ matrix.asset }}"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: compiler/target/release/${{ matrix.asset }}*

      - name: Native smoke test
        shell: bash
        # The release binary must actually run on the platform it was built
        # for. Emit Rust from a small program, compile it with the runner's
        # rustc, execute it, and compare the output.
        run: |
          bin=$(ls compiler/target/release/${{ matrix.asset }}* | head -n 1)
          reported="$($bin --version)"
          echo "smoke: $bin reports $reported"
          printf 'fn main()\n    put 42\nend fn\n' > smoke.poly
          "$bin" --emit-rust smoke.poly > smoke.rs
          rustc -O smoke.rs -o smoke_bin
          out="$(./smoke_bin)"
          if [ "$out" != "42" ]; then
            echo "smoke test failed: expected 42, got '$out'"
            exit 1
          fi
          echo "smoke: native execution prints 42"

  wasm:
    name: Playground wasm artifact
    permissions: {}
    # Build, gate and upload the module through the same reusable workflow CI
    # runs, so release and CI cannot diverge on toolchain or budget again.
    uses: ./.github/workflows/wasm-build.yml
    with:
      artifact_name: poly-playground-wasm

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, wasm]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so the tag's base branch can be resolved below.
          fetch-depth: 0

      - name: Determine the branch the tag was cut from
        id: branch
        run: |
          # softprops/action-gh-release otherwise records the repository
          # default branch (master), which does not carry the v2 preview line,
          # so the release page named a base the build never came from. Prefer
          # the remote branch whose tip is the tagged commit; fall back to the
          # sole branch containing it.
          tip=""
          fallback=""
          for ref in $(git for-each-ref --contains "$GITHUB_SHA" \
              --format='%(refname:short)' refs/remotes/origin); do
            name="${ref#origin/}"
            [ "$name" = "HEAD" ] && continue
            if [ "$(git rev-parse "origin/${name}")" = "$GITHUB_SHA" ]; then
              tip="$name"
              break
            fi
            [ -z "$fallback" ] && fallback="$name"
          done
          branch="${tip:-$fallback}"
          if [ -z "$branch" ]; then
            echo "::error::no origin branch contains ${GITHUB_SHA}; cannot name the release base"
            exit 1
          fi
          echo "release base branch: ${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ./bin
          merge-multiple: true

      - name: Verify binary version matches the tag
        run: |
          # The tag must name the version it releases; a mismatch means the
          # tag was cut from a tree whose version was never bumped. The
          # Linux binary is the reference; every build compiles the same
          # CARGO_PKG_VERSION. download-artifact does not preserve the
          # executable bit.
          chmod +x ./bin/poly-linux-amd64
          tag="${GITHUB_REF_NAME#v}"
          reported="$(./bin/poly-linux-amd64 --version)"
          if [ "$reported" != "poly ${tag}" ]; then
            echo "version mismatch: binary reports '$reported', tag says '${tag}'"
            exit 1
          fi
          echo "binary version matches tag ${GITHUB_REF_NAME}"

      - name: Verify CHANGELOG documents the tagged version
        run: |
          # A tag whose version is missing from CHANGELOG.md means the
          # release notes were not cut; the release body would then come
          # from a stale POLY_V2_PREVIEW_RELEASE_NOTES.md too.
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[${tag}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [${tag}]' section — cut the release notes before tagging"
            exit 1
          fi
          echo "CHANGELOG.md documents ${tag}"

      - name: Generate checksums and version the binary assets
        run: |
          # Ship a sha256sums.txt covering every uploaded asset. Binaries
          # gain the release version in their name so assets from different
          # releases are distinguishable in a downloads directory.
          version="${GITHUB_REF_NAME#v}"
          cd ./bin
          mv poly-linux-amd64 "poly-linux-amd64-${version}"
          mv poly-macos-arm64 "poly-macos-arm64-${version}"
          mv poly-windows-amd64.exe "poly-windows-amd64-${version}.exe"
          mv poly.wasm "poly-playground-${version}.wasm"
          ls -la
          sha256sum poly-* > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Use the committed release-notes document as the body:
          # POLY_V2_PREVIEW_RELEASE_NOTES.md is maintained by hand each
          # release and carries the Target Contract, Compatibility Notes,
          # and Verification Evidence sections.
          body_path: POLY_V2_PREVIEW_RELEASE_NOTES.md
          # Preview tags publish as prereleases; stable tags (no "preview"
          # segment in the tag name) publish as full releases.
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          # The branch the tag was cut from, not the repository default.
          target_commitish: ${{ steps.branch.outputs.branch }}
          files: |
            ./bin/poly-*
            ./bin/sha256sums.txt

  verify-release:
    name: Verify published release
    runs-on: ubuntu-latest
    # `wasm` is here to read the budget the shared build gated against, not for
    # ordering: create-release already depends on it.
    needs: [create-release, wasm]
    permissions:
      contents: read
    steps:
      # Re-download what the world gets, not the workflow's own artifacts:
      # upload, renaming and checksum generation all sit between the tested
      # builds and the published bytes.
      - name: Download every published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist && cd dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          ls -l

      - name: Verify checksums cover exactly the published assets
        working-directory: dist
        run: |
          sha256sum -c sha256sums.txt
          listed=$(awk '{print $2}' sha256sums.txt | sed 's/^\*//' | sort)
          present=$(ls -1 | grep -v '^sha256sums.txt$' | sort)
          if [ "$listed" != "$present" ]; then
            echo "::error::sha256sums.txt does not list exactly the published assets"
            diff <(echo "$listed") <(echo "$present") || true
            exit 1
          fi
          echo "sha256sums.txt covers every asset"

      - name: Verify asset names carry the release version
        working-directory: dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          for asset in poly-*; do
            case "$asset" in
              *"$version"*) ;;
              *) echo "::error::asset '$asset' does not name version ${version}"; exit 1 ;;
            esac
          done
          echo "asset names name ${version}"

      - name: Verify the linux binary reports the tag version
        working-directory: dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          chmod +x "poly-linux-amd64-${version}"
          reported="$(./"poly-linux-amd64-${version}" --version)"
          if [ "$reported" != "poly ${version}" ]; then
            echo "::error::published binary reports '$reported', tag says '${version}'"
            exit 1
          fi
          echo "published binary reports ${reported}"

      - name: Verify the published wasm header and size
        working-directory: dist
        env:
          # Owned by wasm-build.yml. Failures here used to swallow an empty
          # value: `[ "" -gt "" ]` is a bash error inside an `if`, not a step
          # failure, so the size gate silently passed.
          WASM_SIZE_BUDGET: ${{ needs.wasm.outputs.size_budget }}
        run: |
          if ! [ "$WASM_SIZE_BUDGET" -gt 0 ] 2>/dev/null; then
            echo "::error::WASM_SIZE_BUDGET is '${WASM_SIZE_BUDGET}', not a byte count; the size gate cannot run"
            exit 1
          fi
          wasm="poly-playground-${GITHUB_REF_NAME#v}.wasm"
          header=$(od -An -tx1 -N8 "$wasm" | tr -s ' ' | sed 's/^ //;s/ $//')
          if [ "$header" != "00 61 73 6d 01 00 00 00" ]; then
            echo "::error::${wasm} is not a version-1 wasm module (header: ${header})"
            exit 1
          fi
          size=$(wc -c < "$wasm")
          echo "${wasm}: ${size} bytes (budget: ${WASM_SIZE_BUDGET})"
          if [ "$size" -gt "$WASM_SIZE_BUDGET" ]; then
            echo "::error::published wasm is ${size} bytes, over the ${WASM_SIZE_BUDGET}-byte budget"
            exit 1
          fi

      - name: Verify documented platform formats
        working-directory: dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          mac=$(od -An -tx1 -N4 "poly-macos-arm64-${version}" | tr -s ' ' | sed 's/^ //;s/ $//')
          if [ "$mac" != "cf fa ed fe" ]; then
            echo "::error::macOS asset is not a 64-bit little-endian Mach-O (magic: ${mac})"
            exit 1
          fi
          win=$(od -An -tx1 -N2 "poly-windows-amd64-${version}.exe" | tr -s ' ' | sed 's/^ //;s/ $//')
          if [ "$win" != "4d 5a" ]; then
            echo "::error::Windows asset is not a PE image (magic: ${win})"
            exit 1
          fi
          echo "macOS is Mach-O arm64, Windows is PE"

      - name: Confirm the release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName,url \
            --jq 'if .isDraft then error("release is still a draft") else "release \(.tagName) published at \(.url) (prerelease=\(.isPrerelease))" end'
