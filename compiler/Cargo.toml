[workspace]
resolver = "2"
members = [
    "crates/poly-lexer",
    "crates/poly-parser",
    "crates/poly-types",
    "crates/poly-intermediate-representation",
    "crates/poly-transpiler",
    "crates/poly-cli",
    "crates/poly-lsp",
    "crates/poly-wasm",
    "crates/poly-c-codegen",
    "crates/poly-asm-codegen",
]

[workspace.package]
version = "2.0.0-preview.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/poly-lang/poly"
description = "A minimal systems-language syntax layer with Rust and C backends"

[workspace.dependencies]
poly-lexer = { path = "crates/poly-lexer" }
poly-parser = { path = "crates/poly-parser" }
poly-types = { path = "crates/poly-types" }
poly-intermediate-representation = { path = "crates/poly-intermediate-representation" }
poly-transpiler = { path = "crates/poly-transpiler" }
poly-cli = { path = "crates/poly-cli" }
poly-lsp = { path = "crates/poly-lsp" }
poly-wasm = { path = "crates/poly-wasm" }
poly-c-codegen = { path = "crates/poly-c-codegen" }
poly-asm-codegen = { path = "crates/poly-asm-codegen" }
thiserror = "2"
anyhow = "1"
