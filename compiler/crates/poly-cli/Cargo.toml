[package]
name = "poly-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for the Poly compiler"

[[bin]]
name = "poly"
path = "src/main.rs"

[dependencies]
poly-lexer.workspace = true
poly-parser.workspace = true
poly-transpiler.workspace = true
anyhow.workspace = true

[dev-dependencies]
poly-lexer.workspace = true
poly-parser.workspace = true
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "performance_benchmarks"
harness = false
