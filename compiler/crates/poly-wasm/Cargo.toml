[package]
name = "poly-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM bindings for the Poly compiler, used by the web playground"

[lib]
crate-type = ["cdylib"]

[dependencies]
poly-lexer.workspace = true
poly-parser.workspace = true
# default-features = false drops the Goose backend: the playground only offers
# the rust/c/js targets, and shipping an unused backend costs ~34 KB of the
# browser download. Everything native keeps the workspace default (goose on).
poly-transpiler = { path = "../poly-transpiler", default-features = false }

[lints]
workspace = true
