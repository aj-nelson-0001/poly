[package]
name = "poly-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM bindings for the Poly compiler, used by the web playground"

[lib]
crate-type = ["cdylib"]

[dependencies]
poly-lexer.workspace = true
poly-parser.workspace = true
# default-features = false drops the Goose and asm backends: the playground only
# offers the rust/c/js targets, the module cannot run x86-64 assembly, and
# shipping the two unused backends cost ~34 KB (goose) and ~85 KB (asm) of the
# browser download.
poly-transpiler = { path = "../poly-transpiler", default-features = false }

[lints]
workspace = true
